
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Prenez rendez-vous avec un médecin en toute simplicité.">
    <title>{% block title %}Clinique Santé{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container" aria-label="Navigation principale">
            <a class="brand" href="{{ url_for('accueil') }}">
                <span class="brand-mark" aria-hidden="true">+</span>
                <span>Clinique<span class="brand-accent">Santé</span></span>
            </a>

            <button class="menu-toggle" id="menu-toggle"
                    type="button" aria-label="Ouvrir le menu"
                    aria-controls="nav-links" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-links" id="nav-links">
                <a href="{{ url_for('accueil') }}">Accueil</a>
                <a href="{{ url_for('medecins') }}">Nos médecins</a>
                <a href="{{ url_for('mes_rendez_vous') }}">Mes rendez-vous</a>
                <a class="nav-button" href="{{ url_for('medecins') }}">
                    Prendre rendez-vous
                </a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a class="brand footer-brand" href="{{ url_for('accueil') }}">
                <span class="brand-mark" aria-hidden="true">+</span>
                <span>Clinique<span class="brand-accent">Santé</span></span>
            </a>
            <p>Votre santé, notre priorité.</p>
            <p class="footer-location">Douala, Cameroun</p>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Clinique Santé. Tous droits réservés.</p>
        </div>
    </footer>

    <nav class="mobile-bottom-nav" aria-label="Navigation mobile">
        <a href="{{ url_for('accueil') }}"
           {% if request.endpoint == 'accueil' %}aria-current="page"{% endif %}>
            <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
            </span>
            <span>Accueil</span>
        </a>

        <a href="{{ url_for('medecins') }}"
           {% if request.endpoint in ['medecins', 'detail_medecin'] %}aria-current="page"{% endif %}>
            <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 3v5a6 6 0 0 0 12 0V3M4 3h4M16 3h4M12 14v3a4 4 0 0 0 8 0v-1"/><circle cx="20" cy="14" r="1"/></svg>
            </span>
            <span>Médecins</span>
        </a>

        <a href="{{ url_for('medecins') }}">
            <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>
            </span>
            <span>Réserver</span>
        </a>

        <a href="{{ url_for('mes_rendez_vous') }}"
           {% if request.endpoint == 'mes_rendez_vous' %}aria-current="page"{% endif %}>
            <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M9 15l2 2 4-4"/></svg>
            </span>
            <span>Rendez-vous</span>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
